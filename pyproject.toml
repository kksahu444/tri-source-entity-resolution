[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tri-source-entity-resolution"
version = "0.1.0"
description = "Blocking + learned pairwise matching for three-source business entity resolution (Amazon ML Challenge 2026)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.6",
    "lightgbm>=4.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "torch>=2.6"]
dev = ["pytest>=8"]

[project.scripts]
ter = "entity_resolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
